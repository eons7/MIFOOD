{# Partial: список карточек блюд (для HTMX-подгрузки) #}
{% for item in items %}
  <div class="mifud-product mb-3">
    <img
      class="mifud-product-img"
      src="{{ item.image_url or url_for('static', filename='img/placeholder.png') }}"
      alt="{{ item.name }}"
    />
    <div class="mifud-product-body">
      <div class="d-flex align-items-start justify-content-between gap-2">
        <div>
          <h3 class="mifud-product-title">{{ item.name }}</h3>
          {% if item.description %}
            <p class="small text-muted mb-1">{{ item.description }}</p>
          {% endif %}
        </div>
        <span class="mifud-category-pill flex-shrink-0">{{ item.category.name }}</span>
      </div>
      <div class="mifud-product-meta">
        <span class="mifud-price">{{ item.price|int }} ₽</span>
        <div class="mifud-stepper">
          <button type="button" aria-label="Убавить">−</button>
          <span class="mifud-stepper-value">1</span>
          <button type="button" aria-label="Добавить">+</button>
        </div>
      </div>
    </div>
  </div>
{% else %}
  <div class="text-center text-muted py-4">Блюда не найдены</div>
{% endfor %}
