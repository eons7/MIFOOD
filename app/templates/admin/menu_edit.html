{% extends "base.html" %}

{% block title %}Редактировать блюдо | Админ | МИФУД{% endblock %}

{% block content %}
  <section class="py-3">
    <h1 class="h5 mifud-title mb-3">Редактировать: {{ item.name }}</h1>

    {% if item.image_url %}
      <div class="mb-3">
        <img src="{{ item.image_url }}" alt="{{ item.name }}" style="max-width: 200px; border-radius: 12px;" />
      </div>
    {% endif %}

    <form method="post" action="/admin/menu/{{ item.id }}/edit" enctype="multipart/form-data" class="mifud-card p-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="fw-bold mb-1" for="name">Название</label>
        <input id="name" name="name" type="text" required class="form-control mifud-input" value="{{ item.name }}" />
      </div>

      <div class="mb-3">
        <label class="fw-bold mb-1" for="description">Описание</label>
        <textarea id="description" name="description" rows="2" class="form-control mifud-input">{{ item.description or '' }}</textarea>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="fw-bold mb-1" for="price">Цена, ₽</label>
          <input id="price" name="price" type="number" min="0" step="0.01" required class="form-control mifud-input" value="{{ item.price }}" />
        </div>
        <div class="col-6">
          <label class="fw-bold mb-1" for="category_id">Категория</label>
          <select id="category_id" name="category_id" required class="form-select mifud-input">
            {% for cat in categories %}
              <option value="{{ cat.id }}"{% if cat.id == item.category_id %} selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="fw-bold mb-1" for="photo">Новое фото (необязательно)</label>
        <input id="photo" name="photo" type="file" accept="image/*" class="form-control mifud-input" />
        <small class="text-muted">Оставь пустым, чтобы сохранить текущее.</small>
      </div>

      <div class="d-flex gap-2">
        <a href="/admin/menu" class="btn btn-outline-primary flex-grow-1">ОТМЕНА</a>
        <button type="submit" class="btn mifud-btn-primary flex-grow-1">СОХРАНИТЬ</button>
      </div>
    </form>
  </section>
{% endblock %}
