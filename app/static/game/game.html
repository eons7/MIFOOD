<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Doodle Jump: Web & Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #7f7f7f;
    font-family: sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  canvas {
    display: block;
    image-rendering: auto;
    background: #c8c8c8;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="600" tabindex="0"></canvas>
<script src="game.js"></script>
</body>
</html>
